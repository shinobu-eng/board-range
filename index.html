<script>
/* ═════ cards ═════ */
const RK="23456789TJQKA", SU=["♠","♥","♦","♣"], SCLS=["s0","s1","s2","s3"];
const cstr=c=>RK[c>>2]+SU[c&3];
const fmt=n=>(Math.round(n*10)/10)+"bb";

/* ═════ grid ═════ */
const R13=["A","K","Q","J","T","9","8","7","6","5","4","3","2"];
const ri=Object.fromEntries(R13.map((r,i)=>[r,i]));
const label=(i,j)=>i===j?R13[i]+R13[i]:(i<j?R13[i]+R13[j]+"s":R13[j]+R13[i]+"o");
const nCombo=(i,j)=>i===j?6:(i<j?4:12);
function expand(str){
  const set=new Set();
  str.split(",").map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    const plus=tok.endsWith("+"), t=plus?tok.slice(0,-1):tok;
    if(t.includes("-")){
      const [a,b]=t.split("-");
      if(a[0]===a[1]){const lo=Math.min(ri[a[0]],ri[b[0]]),hi=Math.max(ri[a[0]],ri[b[0]]);
        for(let k=lo;k<=hi;k++)set.add(R13[k]+R13[k]);}
      else{const h=ri[a[0]],s=a[2],lo=Math.min(ri[a[1]],ri[b[1]]),hi=Math.max(ri[a[1]],ri[b[1]]);
        for(let k=lo;k<=hi;k++)set.add(R13[h]+R13[k]+s);}
      return;
    }
    if(t.length===2&&t[0]===t[1]){const hi=ri[t[0]];
      if(plus)for(let k=hi;k>=0;k--)set.add(R13[k]+R13[k]); else set.add(t);}
    else{const a=ri[t[0]],b=ri[t[1]],s=t[2];
      if(plus)for(let k=b;k>a;k--)set.add(R13[a]+R13[k]+s); else set.add(t);}
  });
  return set;
}
function combos(h){
  const out=[],a=ri[h[0]],b=ri[h[1]],t=h[2],ra=12-a,rb=12-b;
  if(a===b){for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)out.push([ra*4+i,ra*4+j])}
  else if(t==="s"){for(let s=0;s<4;s++)out.push([ra*4+s,rb*4+s])}
  else{for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(i!==j)out.push([ra*4+i,rb*4+j])}
  return out;
}

/* ═════ preflop library (heuristic) ═════ */
const OPEN={
 UTG:"55+,ATs+,KTs+,QTs+,JTs,A5s,AJo+,KQo",
 HJ :"44+,A9s+,A4s-A5s,K9s+,Q9s+,J9s+,T9s,98s,ATo+,KJo+",
 CO :"22+,A2s+,K7s+,Q8s+,J8s+,T8s+,97s+,87s,76s,65s,ATo+,KTo+,QJo",
 BTN:"22+,A2s+,K2s+,Q5s+,J7s+,T7s+,96s+,86s+,75s+,64s+,54s,A2o+,K8o+,Q9o+,J9o+,T9o",
 SB :"22+,A2s+,K3s+,Q6s+,J7s+,T7s+,96s+,86s+,75s+,65s,A2o+,K9o+,Q9o+,J9o+",
 BB :"22+,A2s+,K5s+,Q7s+,J8s+,T8s+,97s+,87s,76s,ATo+,KJo+"};
const THREEBET={late:"QQ+,AKs,AKo,AQs,A5s,A4s,KJs,QJs,76s",
 SB:"QQ+,AKs,AKo,AJs,KQs,A5s,A4s",
 BB:"TT+,AJs+,KTs+,QTs+,JTs,A2s-A5s,K9s,87s,76s,AQo+"};
const FLAT={late:"JJ,TT,99,88,77,66,55,44,33,22,AJs,ATs,KQs,KTs,QTs,JTs,T9s,98s,87s,AQo,KQo",
 SB:"JJ,TT,99,88,77,66,55,44,33,22,AQs,ATs,KJs,KTs,QJs,QTs,JTs,T9s,AQo,KQo",
 BB:"99,88,77,66,55,44,33,22,ATs,A9s,A8s,A7s,A6s,Q9s,J9s,T9s,T8s,98s,97s,86s,75s,65s,64s,54s,AJo,ATo,A9o,KQo,KJo,KTo,QJo,QTo,JTo"};
const FOURBET="KK+,AKs,AKo,A5s";

function heurTendency(h,ctx){

  var cs=combos(h).filter(function(cb){return !cb.some(function(c){return board.includes(c);});});
  if(!cs.length)return null;
  var lowSPR = ctx && ctx.spr!=null && ctx.spr<3;                    /* 3bet/4betの膨れたポット=低SPR */
  var oopDefer = ctx && ctx.isOOP && !ctx.isAggr && ctx.spr!=null && ctx.spr<3;  /* OOPコーラーはアグレッサーに譲る(4betのBB等) */
  var vth = lowSPR?2:4;                                              /* 低SPR(膨れポット)=強レンジ相手に弱made handはベットしない→バリュー閾値を厳しく(セット/2ペア/オーバーペアまで) */
  var bet=0,nut=0;

  else return null;

const HEUR={

/* ═════ classification ═════ */
const WIN=(()=>{const w=[[12,0,1,2,3]];for(let i=0;i<=8;i++)w.push([i,i+1,i+2,i+3,i+4]);return w})();
function straightHi(rs){let b=-1;
  if(rs[12]&&rs[0]&&rs[1]&&rs[2]&&rs[3])b=3;
  for(let i=0;i<=8;i++)if(rs[i]&&rs[i+1]&&rs[i+2]&&rs[i+3]&&rs[i+4])b=i+4;return b}

function classify(h1,h2,bd){
  const all=[h1,h2,...bd];
  const rc=new Array(13).fill(0),sc=new Array(4).fill(0);
  all.forEach(c=>{rc[c>>2]++;sc[c&3]++});
  const brc=new Array(13).fill(0),bsc=new Array(4).fill(0);
  bd.forEach(c=>{brc[c>>2]++;bsc[c&3]++});
  const rs=rc.map(x=>x>0),brs=brc.map(x=>x>0);
  let fl=-1;sc.forEach((n,s)=>{if(n>=5)fl=s});
  const sHi=straightHi(rs);
  const t3=rc.filter(x=>x===3).length,p2=rc.filter(x=>x===2).length,q=rc.filter(x=>x===4).length;
  let made=0;
  if(q)made=7; else if((t3&&p2)||t3>1)made=6;
  else if(fl>=0)made=5; else if(sHi>=0)made=4;
  else if(t3)made=3; else if(p2>=2)made=2; else if(p2===1)made=1;
  if(made>=3)return 0;
  if(made===2)return brc.filter(x=>x===2).length>=2?5:1;
  const hr=[h1>>2,h2>>2];
  const bR=[...new Set(bd.map(c=>c>>2))].sort((a,b)=>b-a);
  let strong=false,weak=false;
  if(sc.findIndex((n,s)=>n===4&&bsc[s]<4)>=0)strong=true;
  const d=four(rs)-four(brs);
  if(d>=2)strong=true; else if(d===1)weak=true;
  if(!strong&&bd.length===3&&sc.findIndex((n,s)=>n===3&&bsc[s]<3)>=0)weak=true;
  if(made===1){
    let cat=-1;
    if(hr[0]===hr[1])cat=hr[0]>bR[0]?2:(bR[1]!==undefined&&hr[0]>bR[1]?4:5);
    else{const pr=hr.find(r=>brc[r]>0);
         if(pr!==undefined)cat=pr===bR[0]?3:(pr===bR[1]?4:5);}
    if(cat>=0){ if(strong&&cat>=4)cat=6; return cat; }
    /* ★修正: 盤だけのペア（自分は無関与）＝自分のペアではない。
       下のドロー/オーバーカード/エア評価へフォールスルー（旧版は誤って弱ペア=5にしていた） */
  }
  if(strong)return 6;
  if(weak)return 7;
  return hr.filter(r=>r>bR[0]).length>=2?7:8;
}


/* ═════ v3.2: 7枚評価器・役正確分類・エクイティ ═════ */
const MADE_NAMES=["ハイカード","ワンペア","ツーペア","セット","ストレート","フラッシュ","フルハウス","フォーカード","ストレートフラッシュ"];
const BUCKETS=["強い完成手","セット","ツーペア","オーバーペア","トップペア","2ndペア","下位/ボードペア","ドロー","ハイカード"];
function _strHigh(rs){ // rs: bool[13] rank present (0=2..12=A)
  for(let hi=12;hi>=4;hi--){let ok=true;for(let k=0;k<5;k++)if(!rs[hi-k]){ok=false;break;}if(ok)return hi;}
  if(rs[12]&&rs[3]&&rs[2]&&rs[1]&&rs[0])return 3; return -1;
}
function evalHand(cards){
  const rc=new Array(13).fill(0),sc=new Array(4).fill(0);
  for(const c of cards){rc[c>>2]++;sc[c&3]++;}
  let fs=-1; for(let s=0;s<4;s++)if(sc[s]>=5)fs=s;
  if(fs>=0){const fp=new Array(13).fill(false);for(const c of cards)if((c&3)===fs)fp[c>>2]=true;const sh=_strHigh(fp);if(sh>=0)return[8,sh];}
  const cnts=[];for(let r=0;r<13;r++)if(rc[r])cnts.push([rc[r],r]);
  cnts.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const others=(ex)=>{const o=[];for(let r=12;r>=0;r--)if(rc[r]&&ex.indexOf(r)<0)o.push(r);return o;};
  if(cnts[0][0]===4){const q=cnts[0][1];return[7,q,others([q])[0]];}
  if(cnts[0][0]===3&&cnts[1]&&cnts[1][0]>=2){const t=cnts[0][1];let p=-1;for(let r=12;r>=0;r--)if(r!==t&&rc[r]>=2){p=r;break;}return[6,t,p];}
  if(fs>=0){const fr=[];for(const c of cards)if((c&3)===fs)fr.push(c>>2);fr.sort((a,b)=>b-a);return[5,...fr.slice(0,5)];}
  {const rs=new Array(13);for(let r=0;r<13;r++)rs[r]=rc[r]>0;const sh=_strHigh(rs);if(sh>=0)return[4,sh];}
  if(cnts[0][0]===3){const t=cnts[0][1];return[3,t,...others([t]).slice(0,2)];}
  if(cnts[0][0]===2&&cnts[1]&&cnts[1][0]===2){const p=[cnts[0][1],cnts[1][1]].sort((a,b)=>b-a);return[2,p[0],p[1],others(p)[0]];}
  if(cnts[0][0]===2){const p=cnts[0][1];return[1,p,...others([p]).slice(0,3)];}
  {const k=cards.map(c=>c>>2).sort((a,b)=>b-a);return[0,...k.slice(0,5)];}
}
function cmpEval(a,b){const n=Math.max(a.length,b.length);for(let i=0;i<n;i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x-y;}return 0;}
function _winCount(cards){const rs=new Array(13).fill(false);for(const c of cards)rs[c>>2]=true;let n=0;
  for(let hi=12;hi>=4;hi--){let c=0;for(let k=0;k<5;k++)if(rs[hi-k])c++;if(c===4)n++;}
  {let c=(rs[12]?1:0)+(rs[0]?1:0)+(rs[1]?1:0)+(rs[2]?1:0)+(rs[3]?1:0);if(c===4)n++;}return n;}
function drawsOf(hole,bd,made){
  if(bd.length>=5)return[];const out=[],allc=[...hole,...bd];
  const sa=new Array(4).fill(0),sb=new Array(4).fill(0);
  for(const c of allc)sa[c&3]++;for(const c of bd)sb[c&3]++;
  for(let s=0;s<4;s++){if(sa[s]===4&&sb[s]<4)out.push("FD");else if(bd.length===3&&sa[s]===3&&sb[s]<3)out.push("BDFD");}
  if(made<4){const d=_winCount(allc)-_winCount(bd);if(d>=2)out.push("OESD");else if(d===1)out.push("ガット");}
  return out;
}
function roleOf(h1,h2,bd){
  const hole=[h1,h2],allc=[h1,h2,...bd],ev=evalHand(allc),made=ev[0];
  const holeR=[h1>>2,h2>>2],rc=new Array(13).fill(0);for(const c of allc)rc[c>>2]++;
  const bdesc=[...new Set(bd.map(c=>c>>2))].sort((a,b)=>b-a);
  const draws=drawsOf(hole,bd,made);
  let name=MADE_NAMES[made],sub="",kicker="";
  if(made===1){
    let pr=-1;for(let r=12;r>=0;r--)if(rc[r]===2){pr=r;break;}
    const pocket=holeR[0]===holeR[1];
    const kicks=pocket?[]:holeR.filter(r=>r!==pr);
    if(pocket&&holeR[0]===pr){sub=pr>bdesc[0]?"オーバーペア":(bdesc.length>1&&pr>bdesc[1]?"2ndペア":"下位ペア");}
    else if(holeR.indexOf(pr)>=0){sub=pr===bdesc[0]?"トップペア":(bdesc.length>1&&pr===bdesc[1]?"2ndペア":"下位ペア");}
    else sub="ボードペア";
    if(kicks.length){const hi=Math.max(...kicks);kicker=RK[hi]+"キッカー"+(hi>bdesc[0]?"(強)":"");}
  }
  let label=name;if(sub)label+="／"+sub;if(kicker)label+="("+kicker+")";if(draws.length)label+=" ＋"+draws.join("＋");
  let bucket;
  if(made>=4)bucket="強い完成手";else if(made===3)bucket="セット";else if(made===2)bucket="ツーペア";
  else if(made===1)bucket=(sub==="オーバーペア"?"オーバーペア":sub==="トップペア"?"トップペア":sub==="2ndペア"?"2ndペア":"下位/ボードペア");
  else bucket=(draws.length?"ドロー":"ハイカード");

}
function textureOf(bd){
  if(bd.length<3)return"";
  const rs=bd.map(c=>c>>2),ss=bd.map(c=>c&3);
  const sc=new Array(4).fill(0);ss.forEach(s=>sc[s]++);
  const rc={};rs.forEach(r=>rc[r]=(rc[r]||0)+1);
  const t=[];const maxs=Math.max(...sc);
  if(bd.length>=3){if(maxs>=bd.length)t.push("モノトーン");else if(maxs===2&&bd.length===3)t.push("ツートン");else if(maxs<=1)t.push("レインボー");else t.push("ツートン");}
  const paired=Object.values(rc).some(v=>v>=2);t.push(paired?"ペア":"ノーペア");
  const u=[...new Set(rs)].sort((a,b)=>a-b);let conn=false;
  for(let i=0;i+1<u.length;i++)if(u[i+1]-u[i]<=2)conn=true;
  t.push(conn?"コネクト":"乾き");
  const hi=Math.max(...rs);t.push(hi>=9?"ハイ":(hi>=5?"ミドル":"ロー"));

}
/* combinatorics */
function _comb(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return Math.round(r);}
function _kcombos(arr,k){const out=[];const rec=(s,c)=>{if(c.length===k){out.push(c.slice());return;}for(let i=s;i<arr.length;i++){c.push(arr[i]);rec(i+1,c);c.pop();}};rec(0,[]);return out;}
/* range vs range エクイティ: seats=[{seat,combos:[[c1,c2]]}], bd. 戻り {byseat,mode} */
let MC_ITERS=4000,EXACT_LIMIT=120000;
function equityAll(seatsIn,bd){
  const alive=seatsIn.filter(s=>s.combos.length);
  if(alive.length<2)return{byseat:{},mode:"—"};
  const need=5-bd.length,bset=new Set(bd);
  const deck=[];for(let c=0;c<52;c++)if(!bset.has(c))deck.push(c);
  let prod=1;alive.forEach(s=>prod*=s.combos.length);
  const rem=52-bd.length-2*alive.length;const runs=need>0?_comb(Math.max(rem,0),need):1;
  const wins={};alive.forEach(s=>wins[s.seat]=0);let tot=0;
  const award=(chosen,full)=>{let best=null,w=[];for(let j=0;j<alive.length;j++){const v=evalHand([...chosen[j],...full]);const cp=best===null?1:cmpEval(v,best);if(best===null||cp>0){best=v;w=[j];}else if(cp===0)w.push(j);}tot++;const sh=1/w.length;w.forEach(x=>wins[alive[x].seat]+=sh);};
  if(prod*runs<=EXACT_LIMIT){ // 厳密列挙
    const lists=alive.map(s=>s.combos);
    const rec=(i,chosen,used)=>{
      if(i===alive.length){const d=deck.filter(c=>!used.has(c));const ros=need>0?_kcombos(d,need):[[]];for(const ro of ros)award(chosen,[...bd,...ro]);return;}
      for(const cb of lists[i]){if(used.has(cb[0])||used.has(cb[1]))continue;used.add(cb[0]);used.add(cb[1]);chosen.push(cb);rec(i+1,chosen,used);chosen.pop();used.delete(cb[0]);used.delete(cb[1]);}
    };
    rec(0,[],new Set(bd));
    const by={};alive.forEach(s=>by[s.seat]=tot?wins[s.seat]/tot*100:0);return{byseat:by,mode:"厳密",n:tot};
  }
  const N=MC_ITERS;
  for(let it=0;it<N;it++){
    const used=new Set(bd),chosen=[];let ok=true;
    for(const s of alive){let pk=null;for(let t=0;t<60;t++){const cb=s.combos[(Math.random()*s.combos.length)|0];if(!used.has(cb[0])&&!used.has(cb[1])){pk=cb;break;}}if(!pk){ok=false;break;}used.add(pk[0]);used.add(pk[1]);chosen.push(pk);}
    if(!ok)continue;
    const d=deck.filter(c=>!used.has(c));const full=[...bd];for(let k=0;k<need;k++){const j=(Math.random()*d.length)|0;full.push(d[j]);d.splice(j,1);}
    award(chosen,full);
  }
  const by={};alive.forEach(s=>by[s.seat]=tot?wins[s.seat]/tot*100:0);return{byseat:by,mode:"MC近似",n:tot};
}


/* ═════ v3.3: エクイティ分布グラフ ═════ */
function perComboEquity(hero,vill,bd,K){
  const need=5-bd.length,bset=new Set(bd);
  return hero.map(hc=>{
    let w=0,n=0;
    for(let i=0;i<K;i++){
      let vc=null;for(let t=0;t<40;t++){const cand=vill[(Math.random()*vill.length)|0];
        if(cand[0]!==hc[0]&&cand[0]!==hc[1]&&cand[1]!==hc[0]&&cand[1]!==hc[1]&&!bset.has(cand[0])&&!bset.has(cand[1])){vc=cand;break;}}
      if(!vc)continue;
      const used=new Set([...bd,hc[0],hc[1],vc[0],vc[1]]);const deck=[];for(let c=0;c<52;c++)if(!used.has(c))deck.push(c);
      const full=[...bd];for(let k=0;k<need;k++){const j=(Math.random()*deck.length)|0;full.push(deck[j]);deck.splice(j,1);}
      const cmp=cmpEval(evalHand([...hc,...full]),evalHand([...vc,...full]));
      w+= cmp>0?1:(cmp===0?0.5:0); n++;
    }
    return n?w/n*100:0;
  });
}
/* レンジ内の相対強さ: 自分のレンジを「相手レンジへのエクイティ」で順位付けし、クリックした手の位置(上位何%)を返す。
   リバー=ショーダウン強さ(引くカード無し)で厳密／ターン=残り1枚込み／フロップ=MC概算。ソルバー不要=relative hand strength。 */
function handRangeRank(heroW, villCombos, bd, h){
  const hw=heroW.filter(e=>e.wt>0.02);
  if(!hw.length || !villCombos.length) return null;
  const K = bd.length>=5?400:(bd.length===4?220:140);
  const eqs=perComboEquity(hw.map(e=>e.c), villCombos, bd, K);   // hwと並行
  const hidx=[];for(let i=0;i<hw.length;i++)if(hw[i].h===h)hidx.push(i);
  if(!hidx.length) return null;
  let hs=0;hidx.forEach(i=>hs+=eqs[i]);const handEq=hs/hidx.length;
  let tot=0,below=0;for(let i=0;i<hw.length;i++){tot+=hw[i].wt;if(eqs[i]<handEq-1e-9)below+=hw[i].wt;}
  const pctBelow=tot?below/tot*100:0;
  return {topPct:100-pctBelow, pctBelow, handEq};
}
function rangeRankHtml(rk, bd){

  const top=rk.topPct; let lab,col;
  if(top<=20){lab="レンジ上位＝バリュー(厚く撃てる)";col="#cf5b21";}
  else if(top<=45){lab="中の上＝薄いバリュー / 強めのブラフキャッチ";col="#e0912e";}
  else if(top<=70){lab="中の下＝ブラフキャッチ / チェック寄り";col="#5a9ed0";}

  const markLeft=Math.max(1,Math.min(99,rk.pctBelow)).toFixed(0);   // 左=弱い→右=強い軸での位置(=自分より弱い割合)

    +`<div class="note" style="font-size:9.5px;color:var(--mute);margin-top:2px">← 弱い　自分のレンジ内での位置　強い →　<span style="color:var(--mute)">${src}</span></div>`;

/* ═════ state ═════ */
const POS={6:["UTG","HJ","CO","BTN","SB","BB"],7:["UTG","LJ","HJ","CO","BTN","SB","BB"],8:["UTG","UTG1","LJ","HJ","CO","BTN","SB","BB"],9:["UTG","UTG1","UTG2","LJ","HJ","CO","BTN","SB","BB"]};
let tableSize=6, history=[], board=[], heroSeat="BTN", jump=null;
const SEATSf=()=>POS[tableSize];
const PREORDf=()=>POS[tableSize];
const POSTORDf=()=>{const s=POS[tableSize];return [s[s.length-2],s[s.length-1],...s.slice(0,s.length-2)];};
/* 9max RFI（標準寄り・近似。要調整はここ） */
const OPEN9={
 UTG:"77+,ATs+,KTs+,QTs+,JTs,AQo+",
 UTG1:"66+,A9s+,KTs+,QTs+,JTs,T9s,AJo+,KQo",
 UTG2:"55+,A8s+,KTs+,Q9s+,J9s+,T9s,98s,AJo+,KQo",
 LJ:"44+,A7s+,K9s+,Q9s+,J9s+,T8s+,98s,ATo+,KQo",
 HJ:"22+,A5s+,K9s+,Q9s+,J9s+,T8s+,97s+,87s,ATo+,KJo+",
 CO:"22+,A2s+,K8s+,Q9s+,J9s+,T8s+,97s+,86s+,76s,65s,ATo+,KTo+,QJo",
 BTN:"22+,A2s+,K2s+,Q6s+,J7s+,T7s+,96s+,86s+,75s+,64s+,54s,A2o+,K9o+,Q9o+,J9o+,T9o",
 SB:"22+,A2s+,K5s+,Q8s+,J8s+,T8s+,97s+,87s,76s,65s,A2o+,K9o+,Q9o+,JTo",
 BB:"22+,A2s+,K5s+,Q7s+,J8s+,T8s+,97s+,87s,76s,ATo+,KJo+"};
const RFI=()=>(tableSize>=7?OPEN9D:OPEND)[stackDepth];
/* 席を楕円上に角度配置（席数可変） */
function seatXY(s){const a=POS[tableSize],i=a.indexOf(s),n=a.length,ang=-Math.PI/2+i*2*Math.PI/n;
  return [50+44*Math.cos(ang),52+42*Math.sin(ang)];}

function replay(){
  const P={};SEATSf().forEach(s=>P[s]={fold:false,inv:0,committed:0,acted:false,allin:false,range:null});
  P.SB.inv=.5;P.SB.committed=.5;P.BB.inv=1;P.BB.committed=1;
  let bet=1,raises=1,street=0,pot=1.5,done=false,winner=null,limpers=0;
  const order=()=>street===0?PREORDf():POSTORDf();
  const aliveL=()=>order().filter(s=>!P[s].fold);
  const rem=s=>Math.max(0,stackDepth-P[s].committed);
  const put=(s,target)=>{const p=P[s],want=Math.min(target,p.inv+rem(s)),add=want-p.inv;pot+=add;p.committed+=add;p.inv=want;if(stackDepth-p.committed<=1e-9)p.allin=true;return p.inv;};
  const next=()=>{ if(done)return null;
    for(const s of order()){const p=P[s];if(p.fold||p.allin)continue;
      if(!p.acted||p.inv<bet)return s} return null};

  for(const h of history){
    let cur=next();
    while(cur&&cur!==h.seat){P[cur].fold=true;P[cur].acted=true;cur=next()}
    if(!cur)break;
    const p=P[h.seat], rBefore=raises, betBefore=bet, potBefore=pot;
    h._st=street;
    h._big = (h.a==="call"||h.a==="allin") && street>0 && betBefore>=potBefore*0.5;
    if(h.a==="fold"){p.fold=true;p.acted=true}
    else if(h.a==="check")p.acted=true;
    else if(h.a==="call"){if(street===0&&rBefore<=1)limpers++;put(h.seat,bet);p.acted=true}
    else if(h.a==="allin"){const nb=put(h.seat,stackDepth);if(nb>bet){bet=nb;raises++;SEATSf().forEach(s=>{if(s!==h.seat&&!P[s].fold&&!P[s].allin)P[s].acted=false})}p.acted=true}
    else{const nb=put(h.seat,h.size);if(nb>bet){bet=nb;raises++;SEATSf().forEach(s=>{if(s!==h.seat&&!P[s].fold&&!P[s].allin)P[s].acted=false})}p.acted=true}

    if(street===0&&h.a!=="fold"){
      const cls=h.seat==="BB"?"BB":(h.seat==="SB"?"SB":"late");
      if(h.a==="check")p.range=BBCHK;
      else if(h.a==="call")p.range = rBefore<=1?LIMP:(rBefore===2?curFLAT()[cls]:CALL3B);
      else if(h.a==="allin")p.range = rBefore<=1?(curJAM()[h.seat]||RFI()[h.seat]):curFOURBET();
      else p.range = rBefore<=1?(limpers>0?(curISO()[cls]||RFI()[h.seat]):RFI()[h.seat]):(rBefore===2?curTHREEBET()[cls]:curFOURBET());
    }
    if(!next()){
      if(aliveL().length<2){done=true;winner=aliveL()[0]}
      else if(street===3)done=true;
      else{street++;SEATSf().forEach(s=>{P[s].acted=false;P[s].inv=0});bet=0;raises=0}
    }
  }
  return {P,pot,bet,street,done,winner,next:next(),alive:aliveL(),
          needCards:[0,3,4,5][street]};
}

function legal(st,actor){
  const p=st.P[actor], facing=st.bet-p.inv, rem=Math.max(0,stackDepth-p.committed), full=p.inv+rem;
  const allin=["allin","オールイン "+fmt(full),"agg"];
  if(facing>0){
    const ca=Math.min(facing,rem);
    const a=[["fold","フォールド","fold"],["call","コール "+fmt(ca)+(ca>=rem?"(A)":""),""]];
    if(rem>facing){
      const r = st.street===0 ? (st.bet<=1?2.5:st.bet*3) : st.bet*3;
      if(r<full)a.push(["raise","レイズ "+fmt(r),"agg",r]);
      a.push(allin);
    }
    return a;
  }
  if(st.street===0){
    const a=[["fold","フォールド","fold"],["check","チェック",""]];
    if(2.5<full)a.push(["raise","レイズ "+fmt(2.5),"agg",2.5]);
    a.push(allin); return a;
  }
  const a=[["check","チェック",""]];
  if(st.pot*.3<full)a.push(["bet","ベット30% "+fmt(st.pot*.3),"agg",st.pot*.3]);
  if(st.pot*.7<full)a.push(["bet2","ベット70% "+fmt(st.pot*.7),"agg",st.pot*.7]);
  a.push(allin); return a;
}

/* ═════ solve ═════ */
function solve(st, actor){
  const res=[];
  st.alive.forEach(seat=>{
    const p=st.P[seat]; let rng=p.range;
    if(!rng && st.street===0 && seat===actor){ /* プリフロのベッティング中のみ・現在の手番(カーソル)の席のみ。コール後は街がフロップに進むので出さない(=p.rangeで表示) */
      const pr=(typeof preflopResolve!=="undefined")?preflopResolve(seat):null;
      if(pr){const pl=preflopPlayed(pr);rng=pl.length?pl.join(","):null;}
      if(!rng){const rf=RFI();rng=rf&&rf[seat]?rf[seat]:null;}
    }
    if(!rng)return;
    const set=(rangeEdit[seat]&&rangeEdit[seat].size)?rangeEdit[seat]:expand(rng); const w=[]; let start=0;
    for(let x=0;x<13;x++)for(let y=0;y<13;y++){
      const h=label(x,y); if(!set.has(h))continue;
      combos(h).forEach(cb=>{
        if(cb.some(c=>board.includes(c)))return;
        w.push({h,c:cb,wt:1});start++;
      });
    }
    res.push({seat,w,start,range:(rangeEdit[seat]&&rangeEdit[seat].size)?("カスタム(編集"+rangeEdit[seat].size+"手)"):rng});
  });
  [[1,3],[2,4],[3,5]].forEach(([sn,need])=>{
    if(board.length<need)return;
    const bd=board.slice(0,need);
    const seq=history.filter(h=>h._st===sn);
    seq.forEach((h,n)=>{
      const r=res.find(x=>x.seat===h.seat); if(!r)return;
      const behind=seq.length-1-n, closes=behind===0;
      const key = h.a==="bet"?"betS" : h.a==="bet2"?"betL" : h.a==="allin"?"betL" :
                  h.a==="call"?(h._big?"callL":"callS") : h.a;
      r.w.forEach(e=>{e.wt*=freqFor(key,classify(e.c[0],e.c[1],bd),closes,behind)});
    });
  });
  /* Phase1: GTO焼き込み(STRAT)の統一プラグ点。STRATにこのノードの手があれば到達頻度(reach)を重みへ反映。空なら不変。 */
  res.forEach(r=>{const sm=STRAT[spotKey(r.seat)];if(sm){r.w.forEach(e=>{if(sm[e.h]&&sm[e.h].reach!=null)e.wt*=sm[e.h].reach;});}});
  const bd=board.slice(0,Math.min(board.length,5));
  res.forEach(r=>{r.cats=new Array(9).fill(0);
    if(bd.length>=3)r.w.forEach(e=>{r.cats[classify(e.c[0],e.c[1],bd)]+=e.wt})});
  return res;
}

/* ═════ render ═════ */
const NM={fold:"フォールド",check:"チェック",call:"コール",raise:"レイズ",
          bet:"ベット30%",bet2:"ベット70%",allin:"オールイン"};
function render(){
  const st=replay();
  if(jump&&(st.P[jump].fold||st.done))jump=null;
  const actor = jump || st.next;

  const tbl=document.getElementById("tbl");
  [...tbl.querySelectorAll(".seat")].forEach(e=>e.remove());
  SEATSf().forEach(s=>{
    const p=st.P[s],d=document.createElement("div");
    d.className="seat"+(p.fold?" out":" live")+(actor===s?" turn":"")+(s===heroSeat?" hero":"");
    const xy=seatXY(s);d.style.left=xy[0]+"%";d.style.top=xy[1]+"%";
    const last=[...history].reverse().find(h=>h.seat===s&&h._st===st.street);
    d.innerHTML=`<div class="p">${s}</div><div class="s">${
      p.fold?"フォールド":(last?NM[last.a]:(p.inv?fmt(p.inv):"—"))}</div>`;
    d.onclick=()=>{
      if(st.done||p.fold)return;
      const ord=(st.street===0?PREORDf():POSTORDf()).filter(x=>!st.P[x].fold);
      if(ord.indexOf(s)>=ord.indexOf(st.next)){jump=s;render()}
    };
    tbl.appendChild(d);
  });
  document.getElementById("pot").textContent="ポット "+fmt(st.pot);
  const bc=document.getElementById("bcards");bc.innerHTML="";
  board.forEach(c=>{const e=document.createElement("div");
    const s=c&3;e.className="bc"+((s===1||s===2)?" r":(s===3?" g":""));
    e.textContent=cstr(c);bc.appendChild(e)});

  const ar=document.getElementById("actRow");ar.innerHTML="";
  const tl=document.getElementById("turnLbl");
  const SNAME=["プリフロップ","フロップ","ターン","リバー"];
  if(st.done){tl.textContent="ハンド終了"+(st.winner?`（${st.winner} が単独で残った）`:"");}
  else if(board.length<st.needCards){
    tl.textContent=`${SNAME[st.street]}のカードを選択（あと ${st.needCards-board.length} 枚）`;
  }else{
    tl.innerHTML=`${SNAME[st.street]}　—　<b>${actor}</b> のアクション`+
      (jump&&jump!==st.next?`　<span style="color:#e0533c">※ ${st.next} 以降は自動フォールド</span>`:"");
    legal(st,actor).forEach(([a,t,cls,size])=>{
      const b=document.createElement("button");
      b.className="t "+cls+" act-"+a;b.textContent=t;
      b.onclick=()=>{history.push({seat:actor,a,size:size||0});jump=null;render()};
      ar.appendChild(b);
    });
  }

  const dk=document.getElementById("deck");dk.innerHTML="";
  const need=st.needCards;
  document.getElementById("deckLbl").textContent=
    board.length>=need?`ボード（${board.length}枚）`:`ボード — ${SNAME[st.street]}を選択`;
  for(let s=0;s<4;s++)for(let r=12;r>=0;r--){
    const c=r*4+s,b=document.createElement("button");
    b.className=SCLS[s];b.textContent=RK[r]+SU[s];
    b.disabled=board.includes(c)||board.length>=need;
    b.onclick=()=>{if(board.length<need){board.push(c);render()}};
    dk.appendChild(b);
  }

  const lg=document.getElementById("log");
  if(!history.length)lg.innerHTML='<span class="note">まだアクションがありません。UTGから始まります。</span>';
  else{
    let cur=-1,h="";
    history.forEach(x=>{
      if(x._st!==cur){cur=x._st;h+=`<span class="st">— ${SNAME[cur]} —</span><br>`}
      h+=`<b>${x.seat}</b> ${NM[x.a]}${x.size?" "+fmt(x.size):""}<br>`;
    });
    lg.innerHTML=h;
  }
  drawOut(st);
  markSel();
}
function markSel(){
  document.querySelectorAll("[data-ts]").forEach(b=>{if(b.classList)b.classList.toggle("sel",+b.dataset.ts===tableSize);});
  document.querySelectorAll("[data-bb]").forEach(b=>{if(b.classList)b.classList.toggle("sel",+b.dataset.bb===stackDepth);});
  const g=id=>document.getElementById(id);
  const eb=g("editBtn"),pb=g("precBtn");
  if(eb&&eb.classList)eb.classList.toggle("selg",editMode);
  if(pb&&pb.classList)pb.classList.toggle("sel",typeof MC_ITERS!=="undefined"&&MC_ITERS>4000);
}
function renderSolList(){
  const el=document.getElementById("solList");if(!el)return;
  const NMS={approx:"近似",standard:"標準",high:"高精度"};
  let h="";
  if(typeof GTO!=="undefined"){
    const seenB={};
    Object.keys(GTO).forEach(key=>{const gg=GTO[key],st=gg.sets[gg.best];
      const m=key.match(/d(\d+)\|b=([a-zA-Z0-9]+)\|@(\w+)/);const dep=m?m[1]:"",bd=m?m[2]:key;
      if(seenB[bd])return;seenB[bd]=1;
      const stg=({river:"リバー","turn-river":"ターン","flop-turn-river":"フロップ"});
      const sk=gg.best.split(".")[0],sn=stg[sk]||sk;
      h+=`<button class="solb" onclick="jumpSpot('${key}')"><span><span class="t2">${sn}｜${bd}｜${dep}bb</span><span class="m2">${gg.best}</span></span><span class="tag ${st.tier}">${NMS[st.tier]||st.tier}</span></button>`;
    });
  }
  h+=`<button class="solb" onclick="showPreflop()"><span><span class="t2">プリフロRFI（Pioソース）</span><span class="m2">6max 100bb オープン範囲（★/手番の席を表示）</span></span><span class="tag high">Pio</span></button>`;
  el.innerHTML=h;
}
function jumpSpot(key){
  const m=key.match(/^t(\d+)\|d(\d+)\|b=([a-zA-Z0-9]+)\|@(\w+)/);if(!m)return;
  tableSize=+m[1];stackDepth=+m[2];heroSeat=m[4];
  const bs=m[3],cs=[];for(let i=0;i<bs.length;i+=2)cs.push(RK.indexOf(bs[i])*4+"shdc".indexOf(bs[i+1]));
  board=cs;var g0=(typeof GTO!=="undefined")?GTO[key]:null;history=(g0&&g0.line)?g0.line.map(function(h){return {seat:h.seat,a:h.a,size:h.size||0};}):[{seat:"BTN",a:"raise",size:2.5},{seat:"BB",a:"call"}];
  jump=null;rangeEdit={};gridMode=true;if(typeof GTO!=="undefined"){SEATSf().forEach(function(sq){var g2=GTO[gtoKey(sq)];if(g2)rangeEdit[sq]=new Set(Object.keys(g2.sets[g2.best].hands));});}render();
  document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"});
}
function showPreflop(){tableSize=6;stackDepth=100;board=[];history=[];heroSeat="BTN";jump=null;rangeEdit={};gridMode=false;render();}

function drawOut(st){
  const actor = (jump && st.P[jump] && !st.P[jump].fold && !st.done) ? jump : st.next;   /* 現在の手番(カーソル)。render()と同基準 */
  const out=document.getElementById("out");
  const det=document.getElementById("detail");
  if(det&&det.parentNode===out&&out.parentNode)out.parentNode.insertBefore(det,out.nextSibling);
  out.innerHTML="";
  if(det)det.innerHTML="";
  const tex=document.getElementById("texture");
  tex.textContent = board.length>=3 ? ("ボード分類： "+textureOf(board)) : "";
  const res=solve(st, actor);
  window.__last={res,board:board.slice()};
  if(!res.length){out.innerHTML='<div class="panel"><div class="note">プリフロップのアクションを入れると、生き残った各プレイヤーのレンジが出ます。</div></div>';return;}
  // range vs range エクイティ（生存レンジ＝生存コンボ）
  let eqRes={byseat:{},mode:"—"};
  if(board.length>=3){
    const seatsForEq=res.map(r=>({seat:r.seat,combos:r.w.filter(e=>e.wt>0.02).map(e=>e.c)}));
    eqRes=equityAll(seatsForEq,board);
  }
  window.__last.eq=eqRes;
  {const sb=document.getElementById("stkBoard");if(sb)sb.innerHTML=board.length?board.map(function(c){var su=c&3;var cl=su===3?"g":((su===1||su===2)?"r":"");return '<span class="bcs '+cl+'">'+cstr(c)+'</span>';}).join(""):'<span style="color:var(--mute);font-size:13px">プリフロップ</span>';
   const se=document.getElementById("stkEq");if(se){const ks=Object.keys(eqRes.byseat||{});se.textContent=ks.length?("  "+ks.map(s=>s+" "+eqRes.byseat[s].toFixed(0)+"%").join("  ")):"";}}
  /* ヒューリスティックのSPR/役割コンテキスト(低SPR=3bet/4betポットで挙動を変える) */
  var _effBehind=Math.min.apply(null,res.map(function(rr){return stackDepth-(st.P[rr.seat]?st.P[rr.seat].committed:0);}));
  var _spr = st.pot>0 ? _effBehind/st.pot : 99;
  var _postOrd=(typeof POSTORDf==="function")?POSTORDf().filter(function(s){return st.P[s]&&!st.P[s].fold;}):[];
  var _oopSeat=_postOrd[0];
  var _aggrSeat=null;history.forEach(function(hh){if(hh._st===0&&(hh.a==="raise"||hh.a==="bet"||hh.a==="bet2"||hh.a==="allin"))_aggrSeat=hh.seat;});
  res.forEach(r=>{
    const cell={};let tot=0;r.w.forEach(e=>{cell[e.h]=(cell[e.h]||0)+e.wt;tot+=e.wt});
    const _hctx={spr:_spr,isOOP:(r.seat===_oopSeat),isAggr:(r.seat===_aggrSeat)};
    const keep=r.start?tot/r.start*100:0,pct=tot/1326*100;
    const d=document.createElement("div");d.className="panel";
    const eqv=eqRes.byseat[r.seat];
    const eqStr = (eqv!==undefined)?`<span style="color:var(--live)">Eq ${eqv.toFixed(1)}%</span>`:"";
    let html=`<div class="head"><span class="who">${r.seat}${r.seat===heroSeat?" ★":""}
      <small>${r.range.length>62?r.range.slice(0,60)+"…":r.range}</small></span>
      <span class="keep">${eqStr}<br><b>${keep.toFixed(0)}%</b> 残存 · 全体 ${pct.toFixed(1)}%</span></div><div class="grid">`;
    const isTurn=(r.seat===actor);   /* この席が今アクションを選べる手番か。手番でない席はアクション内訳を出さない(密度のみ)=プリフロ/ポストフロ/全ライン共通 */
    const gres=isTurn?((st.street===0)?((typeof preflopResolve!=="undefined")?preflopResolve(r.seat):null):((typeof gtoResolve!=="undefined")?gtoResolve(r.seat):null)):null;
    const gbands=(gres&&gres.pre)?PBAND:ABAND;
    const faces=isTurn && board.length>=3 && st.P[r.seat] && (st.bet - st.P[r.seat].inv) > 0.001;   /* この席がベットに直面(受け手・かつ手番)=フォールド/コール/レイズの概算を出す */
    for(let x=0;x<13;x++)for(let y=0;y<13;y++){
      const h=label(x,y);
      const reach=Math.min(1,(cell[h]||0)/nCombo(x,y));   // 残コンボ量=塗りの幅
      let fill="";
      if(reach>0.004){
        const w=(18+82*Math.sqrt(reach)).toFixed(0);   /* 非線形: 小コンボも視認・正確数はクリック */
        let grad;
        if(gres){
          if(gres.st.hands[h]!=null){grad=bandGrad(gres.st.hands[h],gbands);}   // 色=GTO全アクション分布(色覚安全・多帯/プリフロはPBAND)
          else{grad="#39414d";}   // GTOありだが解レンジ外=中立グレー(緑にしない)
        }else if(faces){          // ベットを受けた側=フォールド/コール/レイズ(概算・縞)
          var hf=(typeof heurFaceBet!=="undefined")?heurFaceBet(h):null;
          grad=hf?heurFaceGrad(hf):"#2f9e59";
        }else if(board.length>=3 && isTurn){   // ポストフロップの先手=ベット/チェック(概算・縞)。手番の席のみ・turn/riverも役の強さで
          var ht=(typeof heurTendency!=="undefined")?heurTendency(h,_hctx):null;
          grad=ht?heurGrad(ht):"#2f9e59";
        }else{grad="#2f9e59";}     // 手番でない/プリフロでsolved無し=緑(レンジ密度のみ・アクション内訳は出さない)
        fill=`<div class="cf" style="width:${w}%;background:${grad}"></div>`;
      }
      html+=`<div class="c" data-h="${h}" data-seat="${r.seat}">${fill}<span class="cl">${h}</span></div>`;
    }
    html+="</div>";
    if(gres){var bands=gres.pre?PBAND.map(function(b){return '<span><i style="background:'+b[1]+'"></i>'+b[2]+'</span>';}).join(''):(gres.st.rich?ABAND.map(function(b){return '<span><i style="background:'+b[1]+'"></i>'+b[2]+'</span>';}).join(''):'<span><i style="background:#e0912e"></i>ベット</span><span><i style="background:#4a90c2"></i>チェック</span>');
      var srcLbl=gres.pre?'Pio(プリフロップ)':('GTO('+({approx:"近似",standard:"標準",high:"高精度"}[gres.st.tier]||gres.st.tier)+')');
      html+='<div class="gleg"><span class="amt"></span>幅=残コンボ量'+bands+'<span>'+srcLbl+'</span></div><div class="note" style="font-size:10px;margin-top:5px;line-height:1.55;color:#9aa4b2">前提：'+gres.st.premise+'</div>';}
    else if(faces){   // ベットを受けた側=フォールド/コール/レイズ(概算・縞)
      var fb=Object.keys(FBAND).map(function(k){var c=FBAND[k];return '<span><i style="background:repeating-linear-gradient(45deg,'+c[0]+' 0 3px,'+c[1]+' 3px 6px)"></i>'+c[2]+'</span>';}).join('');
      html+='<div class="gleg"><span class="amt"></span>幅=残コンボ量'+fb+'<span style="color:#c98a3a">≈ヒューリスティック(概算)</span></div><div class="note" style="font-size:10px;margin-top:5px;line-height:1.55;color:#9aa4b2">⚠️ベットを受けた側の「役の強さによる粗い方針」（縞＝概算・GTOではない）。強い完成手→レイズ寄り／トップペア・強ドロー→コール／エア→フォールド。</div>';}
    else if(board.length>=3 && isTurn){   // ヒューリスティック凡例(縞・概算・先手/turn/river・手番の席のみ)
      var hb=Object.keys(HEURC).map(function(k){var c=HEURC[k];return '<span><i style="background:repeating-linear-gradient(45deg,'+c[0]+' 0 3px,'+c[1]+' 3px 6px)"></i>'+c[2]+'</span>';}).join('');
      var sprNote=(_spr<3)?(' <b style="color:#c98a3a">低SPR('+_spr.toFixed(1)+')補正ON</b>＝膨れたポット(3bet/4bet)。OOPのコーラーはアグレッサーに譲りチェック多め／ドローは含みオッズ薄で撃たない。'):(' SPR≈'+(_spr>=99?'—':_spr.toFixed(1))+'。');
      html+='<div class="gleg"><span class="amt"></span>幅=残コンボ量'+hb+'<span style="color:#c98a3a">≈ヒューリスティック(概算)</span></div><div class="note" style="font-size:10px;margin-top:5px;line-height:1.55;color:#9aa4b2">⚠️これはGTOソルバーの解ではなく「役の強さによる粗い方針」（縞模様＝概算）。バリュー+ドロー→ベット寄り／ミドル・エア→チェック寄り。'+sprNote+'正確な頻度は🗂解ライブラリの盤（solid色）を参照。</div>';}
    else html+='<div class="gleg"><span class="amt"></span>幅=残コンボ量（緑＝レンジ密度）</div>';
    // 役バケット内訳（roleOf=役正確）。OVERRIDE(焼き込み)があればそれを優先。
    const ovKey=r.range+"@"+canonBoard(board);
    const ov=(board.length>=3&&!postActed(r.seat))?OVERRIDE[ovKey]:null;
    if(board.length>=3){
      const bc={};BUCKETS.forEach(b=>bc[b]=0);
      r.w.forEach(e=>{bc[roleOf(e.c[0],e.c[1],board).bucket]+=e.wt});
      html+='<div class="brk">';
      BUCKETS.forEach(b=>{if(bc[b]>=0.5)html+=`<span class="chip">${b} <b>${bc[b].toFixed(0)}</b></span>`});
      html+="</div>";
    }
    // 出処/カバレッジ
    let src;
    if(ov)src=`<b style="color:var(--live)">焼き込み（${ov.src}）</b> ／ 保存エクイティ ${ov.eq}%`;
    else if(eqv!==undefined)src=`エクイティ：<b style="color:var(--live)">${eqRes.mode}</b>（${eqRes.n||0}） ／ 役分類：厳密 ／ 頻度絞り：<b>近似(HEUR)</b>`;
    else src='<b>ヒューリスティック（近似）</b>';
    html+=`<div class="src">${src}</div>`;
    d.innerHTML=html;out.appendChild(d);
  });
  {const ps=out.querySelectorAll(".panel");if(det){if(ps.length>=2)ps[0].after(det);else out.appendChild(det);}}
}
/* セルタップ：その手の役＋コンボ＋エクイティ */
function cellTap(h,seat){
  const L=window.__last;if(!L||board.length<3)return;
  const r=L.res.find(x=>x.seat===seat);if(!r)return;
  const combos=r.w.filter(e=>e.h===h&&e.wt>0.02).map(e=>e.c);
  const det=document.getElementById("detail");
  if(!combos.length){det.innerHTML=`<div class="panel"><div class="note">${seat}: ${h} はこのレンジ/絞りに残っていません。</div></div>`;return;}
  // 役ラベル（コンボごと。異なればまとめる）
  const labs=[...new Set(combos.map(c=>roleOf(c[0],c[1],board).label))];
  // このハンド vs 他生存レンジ のエクイティ
  const others=L.res.filter(x=>x.seat!==seat).map(x=>({seat:x.seat,combos:x.w.filter(e=>e.wt>0.02).map(e=>e.c)}));
  let eqTxt="";
  if(others.some(o=>o.combos.length)){
    const eq=equityAll([{seat,combos},...others],board);
    eqTxt=`エクイティ vs 生存レンジ：<b style="color:var(--live)">${(eq.byseat[seat]||0).toFixed(1)}%</b>（${eq.mode}）`;
  }
  let gtoTxt="";
  {const R=(board.length===0)?((typeof preflopResolve!=="undefined")?preflopResolve(seat):null):((typeof gtoResolve!=="undefined")?gtoResolve(seat):null);const gm=R?R.st.hands[h]:undefined;
   if(gm!=null){const tl=R.pre?"Pio":({approx:"近似",standard:"標準",high:"高精度"}[R.st.tier]||R.st.tier);const col=R.pre?"var(--act)":(R.st.tier==="high"?"var(--live)":"var(--act)");const bset=R.pre?PBAND:ABAND;
     let mix;
     if(typeof gm==="object"){mix=bset.filter(function(b){return Math.round((gm[b[0]]||0)*100)>0;}).map(function(b){return '<b style="color:'+b[1]+'">'+b[2]+' '+Math.round(gm[b[0]]*100)+'%</b>';}).join(' / ');}
     else{const bet=Math.round(gm*100);mix='<b style="color:#e0912e">ベット '+bet+'%</b> / <b style="color:#4a90c2">チェック '+(100-bet)+'%</b>';}
     gtoTxt=`<div class="note" style="margin-top:6px">GTO・<b style="color:${col}">${tl}</b>（${R.st.method}）：${mix}　<span style="color:var(--mute)">${R.st.conv||("収束 "+R.st.exploitability+"bb")}</span></div>`;}}
  // レンジ内の相対強さ(上位何%＝バリュー/ブラフキャッチ/弱)。相手の生存レンジへのエクイティで順位付け(ソルバー不要)。
  let rankTxt="";
  {const vill=others.flatMap(o=>o.combos);
   const rk=(vill.length)?handRangeRank(r.w,vill,board,h):null;
   rankTxt=rangeRankHtml(rk,board);}
  det.innerHTML=`<div class="panel"><div class="who">${seat} — ${h}（${combos.length}コンボ）</div>
    <div class="note" style="margin-top:5px">役：<b>${labs.join(" / ")}</b></div>
    <div class="note" style="margin-top:4px">${eqTxt}</div>${rankTxt}${gtoTxt}</div>`;
  {const sh=document.getElementById("stkHand");if(sh){const m=eqTxt?eqTxt.match(/([\d.]+%)/):null;sh.innerHTML="<b>"+seat+" "+h+"</b> "+(m?m[1]:"");}}
}

function toggleEdit(h,seat){
  const L=window.__last;if(!L||!L.res)return;const r=L.res.find(x=>x.seat===seat);if(!r)return;
  if(!rangeEdit[seat])rangeEdit[seat]=new Set(expand(r.range));
  if(rangeEdit[seat].has(h))rangeEdit[seat].delete(h);else rangeEdit[seat].add(h);
  render();
}
function copySpot(){
  const L=window.__last;
  const rr=(L&&L.res&&L.res.length)?L.res.map(r=>r.seat+":"+r.range).join("\n  "):"(プリフロ未確定)";
  const bd=board.map(cstr).join("")||"(preflop)";
  const hist=history.map(h=>h.seat+" "+NM[h.a]+(h.size?" "+fmt(h.size):"")).join(", ")||"(none)";
  const keys=(L&&L.res&&L.res.length)?L.res.map(r=>r.seat+": "+spotKey(r.seat)).join("\n  "):"(プリフロ未確定)";
  const txt="[board-range spot]\n"+tableSize+"-max "+stackDepth+"bb\nboard: "+bd+"\nactions: "+hist+"\nspotKeys:\n  "+keys+"\nranges:\n  "+rr;
  const d=document.getElementById("copyOut");
  d.innerHTML='<div class="panel"><div class="lbl">スポット（コピーしてクロードに貼る）</div><pre style="white-space:pre-wrap;font-size:11px;color:var(--paper);margin:0">'+txt.replace(/</g,"&lt;")+'</pre></div>';
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).catch(function(){});
}
document.getElementById("undo").onclick=()=>{
  const st=replay();
  if(board.length>st.needCards-0&&board.length>0&&history.length===0)board.pop();
  else if(history.length)history.pop();
  else if(board.length)board.pop();
  jump=null;render();
};
document.getElementById("reset").onclick=()=>{history=[];board=[];jump=null;rangeEdit={};render()};
document.getElementById("graphDet").ontoggle=function(){if(this.open)drawEquityGraph()};
document.querySelectorAll("[data-ts]").forEach(b=>b.onclick=()=>{tableSize=+b.dataset.ts;history=[];board=[];jump=null;heroSeat="BTN";rangeEdit={};render()});
document.querySelectorAll("[data-bb]").forEach(b=>b.onclick=()=>{stackDepth=+b.dataset.bb;history=[];board=[];jump=null;rangeEdit={};render()});
document.getElementById("precBtn").onclick=()=>{const hi=MC_ITERS>4000;MC_ITERS=hi?4000:20000;EXACT_LIMIT=hi?120000:2000000;document.getElementById("precBtn").textContent=hi?"精度アップ":"精度:高";render()};
document.getElementById("copyDet").ontoggle=function(){if(this.open)copySpot()};
renderSolList();
document.getElementById("editBtn").onclick=()=>{editMode=!editMode;document.getElementById("editBtn").textContent=editMode?"✏️編集中(セルで増減)":"✏️ レンジ編集";render()};
document.getElementById("clearEditBtn").onclick=()=>{rangeEdit={};render()};
document.getElementById("heroBtn").onclick=()=>{
  heroSeat=SEATSf()[(SEATSf().indexOf(heroSeat)+1)%tableSize];render()};
document.getElementById("out").addEventListener("click",ev=>{const c=ev.target.closest(".c");if(c&&c.dataset.h){if(editMode)toggleEdit(c.dataset.h,c.dataset.seat);else{document.querySelectorAll("#out .c.csel").forEach(function(x){x.classList.remove("csel")});c.classList.add("csel");cellTap(c.dataset.h,c.dataset.seat);}}});
/* ディープリンク: ?board=AhKd7c で 6max100bb BTN-BB SRP のそのフロップを開く(1755網羅にヒット) */
(function(){try{
  var b=new URLSearchParams(location.search).get("board");
  if(b){var cs=[];for(var i=0;i+1<b.length;i+=2){var r=RK.indexOf(b[i].toUpperCase());var s="shdc".indexOf(b[i+1].toLowerCase());if(r>=0&&s>=0)cs.push(r*4+s);}
    if(cs.length>=3){tableSize=6;stackDepth=100;heroSeat="BB";history=[{seat:"BTN",a:"raise",size:2.5},{seat:"BB",a:"call"}];board=cs.slice(0,5);jump=null;rangeEdit={};}}
}catch(e){}})();
render();
</script>
